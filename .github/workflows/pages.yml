name: Publish traffic lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Verify the browser model against saved Python results
        run: node --experimental-strip-types lib/verify-model.mjs
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
